<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>웰컴미스테익스하우스 호스트 밋업</title><style>
:root{--bg:#EEECEA;--sf:#FFFFFF;--ln:#E4E1DD;--tx:#2B2B2A;--sub:#5F5B57;--ac:#1F3557;--dk:#2E3A2B}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
header{background:var(--dk);color:#F3F1EE;padding:28px 20px 22px}header .in{max-width:1080px;margin:0 auto}
header p.k{margin:0 0 6px;font-size:12px;letter-spacing:.18em;opacity:.7}header h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}header p.d{margin:10px 0 0;font-size:14px;opacity:.85;line-height:1.6}
nav{position:sticky;top:0;z-index:5;background:rgba(238,236,234,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--ln)}nav .in{max-width:1080px;margin:0 auto;display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}nav .in::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{max-width:1080px;margin:0 auto;padding:8px 16px 40px}.sess h2{display:flex;align-items:baseline;gap:8px;font-size:18px;margin:26px 0 12px}.sess h2 em{font-style:normal;color:var(--ac)}.sess h2 small{margin-left:auto;color:var(--sub);font-size:13px;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{display:block;aspect-ratio:4/3;background:#DDD8D2;overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}.card:hover .ph img{transform:scale(1.03)}
.ph.art{aspect-ratio:4/3;background:#F3EFE8}.ph.art svg{width:100%;height:100%;display:block}.ph.empty{aspect-ratio:16/5;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px;background:repeating-linear-gradient(45deg,#E9E6E2,#E9E6E2 10px,#E4E1DD 10px,#E4E1DD 20px)}
.bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}.who b{font-size:16px;margin-right:6px}.who span{font-size:12.5px;color:var(--sub)}
.tt{margin:0;font-size:13.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.tt.muted{color:var(--sub)}
.mt{margin:0;font-size:12.5px;color:var(--sub);line-height:1.5}.st{color:var(--tx);font-weight:600}
.btn{margin-top:auto;display:block;text-align:center;background:var(--ac);color:#fff;text-decoration:none;border-radius:10px;padding:10px;font-size:14px;font-weight:600}
.card.wait .who b::after{content:'링크 대기';margin-left:6px;font-size:11px;font-weight:600;color:#9A4B2F;background:#F4E4DC;border-radius:999px;padding:2px 8px;vertical-align:2px}
.card.prep .who b::after{content:'예비';margin-left:6px;font-size:11px;font-weight:600;color:var(--sub);background:var(--bg);border-radius:999px;padding:2px 8px;vertical-align:2px}
.fb{border-top:1px dashed var(--ln);padding-top:8px;margin-top:2px}.fb .fh{font-size:13px;font-weight:700;color:var(--ac)}.fb p{margin:8px 0 0;font-size:13px;line-height:1.55}.fb b{display:inline-block;font-size:11.5px;border-radius:999px;padding:1px 8px;margin-right:6px}.fb b.g{background:#E6EEF8;color:var(--ac)}.fb b.w{background:#F4E4DC;color:#9A4B2F}
.common{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px 20px;margin-top:22px}.common h2{font-size:17px;margin:0 0 10px}.common ol{margin:0;padding-left:20px;font-size:14px;line-height:1.7}.common .note{margin:10px 0 0;font-size:12.5px;color:var(--sub)}
footer{max-width:1080px;margin:0 auto;padding:0 16px 40px;color:var(--sub);font-size:12.5px;line-height:1.7}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:24px}.mc{display:block;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:22px;text-decoration:none;color:var(--tx)}.mc .y{font-size:12px;letter-spacing:.14em;color:var(--sub)}.mc h2{margin:6px 0 8px;font-size:24px}.mc p{margin:0;font-size:14px;color:var(--sub);line-height:1.6}.mc .go{display:inline-block;margin-top:14px;font-size:14px;font-weight:700;color:var(--ac)}.mc.soon{opacity:.75}.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;margin-left:6px;vertical-align:3px}.tag.now{background:#E6EEF8;color:var(--ac)}.tag.next{background:var(--bg);color:var(--sub)}</style></head><body><header><div class="in"><p class="k">WELCOME MISTAKES HOUSE · HOST MEETUP</p><h1>호스트 밋업 숙소 모음</h1><p class="d">매달 열리는 밋업의 참가자 숙소와 1차 피드백을 월별로 모았어요.</p></div></header><main><div class="months">
